[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-report-pipeline"
version = "0.1.0"
description = "CRM REST API -> PostgreSQL -> LLM weekly sales report (demo rebuild on synthetic data)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Somers" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "faker>=30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
crm-pipeline = "pipeline.cli:main"

[tool.setuptools]
packages = ["mock_crm", "pipeline", "report"]

[tool.setuptools.package-data]
report = ["sql/*.sql", "sql/sqlite/*.sql", "sql/postgres/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a running PostgreSQL (set TEST_PG_URL); skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
